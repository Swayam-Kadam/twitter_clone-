<svg xmlns="http://www.w3.org/2000/svg" width="412" height="412" viewBox="0 0 412 412">
  <defs>
    <pattern id="chat-icons" width="412" height="412" patternUnits="userSpaceOnUse">
      <!-- Speech bubble -->
      <g fill="#128C7E" fill-opacity="0.07" transform="translate(24, 28)">
        <path d="M48 8C25.9 8 8 22.5 8 40c0 10.2 5.4 19.2 13.8 24.8L16 72l9.2-4.8C28.4 68.8 38 70 48 70c22.1 0 40-14.5 40-32S70.1 8 48 8z"/>
      </g>
      <!-- Phone -->
      <g fill="#128C7E" fill-opacity="0.06" transform="translate(180, 40) rotate(-15)">
        <rect x="0" y="0" width="28" height="48" rx="4"/>
        <circle cx="14" cy="42" r="3"/>
      </g>
      <!-- Double check -->
      <g stroke="#128C7E" stroke-opacity="0.08" stroke-width="2.5" fill="none" transform="translate(320, 36)">
        <path d="M4 16l8 8 16-16"/>
        <path d="M16 16l8 8 16-16"/>
      </g>
      <!-- Heart -->
      <g fill="#25D366" fill-opacity="0.06" transform="translate(100, 120)">
        <path d="M24 8c-6 0-11 4-13 9-2-5-7-9-13-9-8 0-14 6-14 14 0 16 27 28 27 28s27-12 27-28c0-8-6-14-14-14z"/>
      </g>
      <!-- Camera -->
      <g fill="#128C7E" fill-opacity="0.06" transform="translate(280, 110)">
        <rect x="0" y="8" width="36" height="28" rx="4"/>
        <circle cx="18" cy="22" r="8"/>
        <rect x="12" y="0" width="12" height="8" rx="2"/>
      </g>
      <!-- Mic -->
      <g fill="#128C7E" fill-opacity="0.06" transform="translate(40, 200)">
        <rect x="10" y="0" width="12" height="24" rx="6"/>
        <path d="M0 12a16 16 0 0032 0M16 28v8M8 36h16"/>
      </g>
      <!-- Star -->
      <g fill="#128C7E" fill-opacity="0.05" transform="translate(200, 190)">
        <path d="M16 0l4.9 10 11.1 1.6-8 7.8 1.9 11L16 26.4 6.1 30.4l1.9-11-8-7.8 11.1-1.6z"/>
      </g>
      <!-- Paperclip -->
      <g stroke="#128C7E" stroke-opacity="0.07" stroke-width="2" fill="none" transform="translate(340, 200)">
        <path d="M20 4v16a8 8 0 01-16 0V8a4 4 0 018 0v12a2 2 0 01-4 0V10"/>
      </g>
      <!-- Emoji smile -->
      <g fill="#128C7E" fill-opacity="0.06" transform="translate(120, 300)">
        <circle cx="16" cy="16" r="16"/>
        <circle cx="10" cy="12" r="2" fill="#fff" fill-opacity="0.5"/>
        <circle cx="22" cy="12" r="2" fill="#fff" fill-opacity="0.5"/>
        <path d="M8 20c3 4 13 4 16 0" stroke="#fff" stroke-opacity="0.4" stroke-width="2" fill="none"/>
      </g>
      <!-- Chat dots -->
      <g fill="#128C7E" fill-opacity="0.07" transform="translate(260, 310)">
        <circle cx="6" cy="16" r="5"/>
        <circle cx="22" cy="16" r="5"/>
        <circle cx="38" cy="16" r="5"/>
      </g>
      <!-- Send arrow -->
      <g fill="#25D366" fill-opacity="0.06" transform="translate(30, 340) rotate(-30)">
        <path d="M0 12L24 0v8h16v8H24v8z"/>
      </g>
      <!-- Group -->
      <g fill="#128C7E" fill-opacity="0.06" transform="translate(180, 330)">
        <circle cx="12" cy="10" r="8"/>
        <circle cx="28" cy="10" r="8"/>
        <path d="M0 32c0-8 8-12 20-12s20 4 20 12"/>
      </g>
    </pattern>
  </defs>
  <rect width="412" height="412" fill="url(#chat-icons)"/>
</svg>
